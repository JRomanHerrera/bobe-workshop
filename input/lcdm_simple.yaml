theory:
  classy:
    input_params:
      - A_s
      - n_s
      - tau_reio
      - omega_b
      - omega_cdm
      - H0
    extra_args:
      non_linear: halofit

likelihood:
  H0_gaussian:
    external: 'lambda H0: -0.5*((H0 - 67.7)/1.0)**2'
  BBN_gaussian:
    external: 'lambda omega_b: -0.5*((omega_b - 0.02218)/0.00055)**2'

params:
  # Parámetros cosmológicos fijos
  logA: 
    value: 3.040776555
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
  n_s: 
    value: 0.9652909209
  tau_reio: 
    value: 0.05546101493
  omega_cdm: 
    value: 0.1200

  # Parámetro libre
  omega_b:
    prior:
      min: 0.021
      max: 0.023
    ref:
      dist: norm
      loc: 0.0224954976
      scale: 0.0001
    proposal: 0.0001
    latex: \Omega_\mathrm{b} h^2
    renames:
      - omega_b
  H0:
    prior:
      min: 64.0
      max: 72.0
    ref:
      dist: norm
      loc: 67.7123491
      scale: 0.05
    proposal: 0.05
    latex: H_0
  h:
    derived: 'lambda H0: H0/100.'

  

  # Parámetros derivados
  Omega_m:
    derived: true
    latex: \Omega_\mathrm{m}
  omega_m:
    derived: 'lambda Omega_m, h: Omega_m*h**2'
    latex: \Omega_\mathrm{m} h^2


sampler:
  mcmc:
    max_samples: 1000

# ============================================================
# Salida
# ============================================================

output: results/lcdm_simple
force: true 
timing: true
#debug: true
